name: CI

# Thin test gate: lint + unit tests + build.
# GitHub Flow (solo): feature branch -> PR into main -> merge -> prod deploy.
# Runs on PRs targeting main and on pushes to main. It is a required status
# check in main's branch protection, so a PR cannot merge until it is green.
# Feature-branch pushes get a Vercel preview (against the dev database) but
# don't run this workflow until a PR is opened against main.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (coverage → blob)
        run: npm run test:ci -- --coverage --reporter=blob --outputFile=.vitest-reports/blob-unit.json

      # Per-tier blob only; the `coverage` job merges this with the db tier into
      # the union total + the dashboard report.
      - name: Upload unit coverage blob
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-unit
          path: .vitest-reports/blob-unit.json
          retention-days: 7

      - name: Build
        run: npm run build
        env:
          # next build imports src/lib/env.ts, which validates these at module
          # load. They are dummy build-time values — no real DB/secret needed to
          # compile. Runtime values come from Vercel's environment.
          DATABASE_URL: postgresql://user:pass@localhost:5432/ci
          AUTH_URL: http://localhost:3000
          AUTH_SECRET: ci-build-only-secret-at-least-32-characters-long

  # DB-gated tests (RUN_DB_TESTS=1) against a real Postgres service. These are
  # describe.skip'd in the plain `gate` job, so the IDOR/pool-schema guard tests
  # only run here. Files run serially (--no-file-parallelism): concurrent
  # RUN_DB_TESTS files deadlock on the shared DB.
  db-tests:
    name: DB integration tests
    runs-on: ubuntu-latest
    # Spinning up Postgres + running the whole integration suite proves nothing
    # about a docs-only change, so gate it on `code` (see the filter). `coverage`
    # needs this job to SUCCEED, so it skips in lockstep — which is right: a change
    # that touches no code cannot move the coverage floor. A docs-only PR is then
    # left with exactly one job, Lint/test/build, which is the point.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply schema
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/app_test

      - name: DB tests (serial, coverage → blob)
        run: >-
          RUN_DB_TESTS=1 npx vitest run --no-file-parallelism src/lib/db
          --coverage --reporter=blob --outputFile=.vitest-reports/blob-db.json
        env:
          DATABASE_URL_TEST: postgresql://postgres:test@localhost:5432/app_test

      - name: Upload DB coverage blob
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-db
          path: .vitest-reports/blob-db.json
          retention-days: 7

  # Merge the two tiers' coverage blobs into the union total and enforce the
  # floor (vitest 4 native --merge-reports). The floor lives ONLY here — the
  # per-tier blob runs above don't enforce thresholds. Also produces the merged
  # coverage/ that the dashboard publishes.
  coverage:
    name: Merged coverage floor
    runs-on: ubuntu-latest
    needs: [gate, db-tests]
    if: ${{ !cancelled() && needs.gate.result == 'success' && needs.db-tests.result == 'success' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - uses: actions/download-artifact@v7
        with:
          name: blob-unit
          path: .vitest-reports
      - uses: actions/download-artifact@v7
        with:
          name: blob-db
          path: .vitest-reports
      - name: Merge coverage + enforce floor
        run: >-
          npx vitest --merge-reports
          --coverage --coverage.reporter=json-summary --coverage.reporter=text-summary --coverage.reporter=html
          --coverage.thresholds.lines=82
      - name: Upload merged coverage (dashboard)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # Did this change touch the UI / how data is presented? Playwright is slow
  # (full next build + 3 viewports, serial), so we only run it when the view
  # layer changed. Pure server/db/docs/config changes are covered by `gate` +
  # `db-tests` and skip e2e.
  #
  # NOTE: positive patterns only. dorny/paths-filter uses picomatch with an OR
  # quantifier, where a leading "!" pattern matches every path NOT in that dir —
  # so `!src/app/api/**` made the filter match almost everything (ci.yml, docs,
  # server, db all triggered e2e). src/app/api routes are under src/app/** and
  # therefore DO trigger e2e; that over-trigger is a safe, cheap price for a
  # correct filter (better than a missed UI regression).
  changes:
    name: Detect UI changes
    runs-on: ubuntu-latest
    # dorny/paths-filter lists the PR's changed files via the GitHub API, which
    # needs pull-requests:read. Scoped to this job so other jobs keep the repo
    # default token permissions.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ui: ${{ steps.filter.outputs.ui }}
      hot: ${{ steps.filter.outputs.hot }}
      # Does this change touch anything that can alter runtime or test behaviour?
      # If not — docs, the governance .md files, the committed graph, beads, agent
      # config — the DB integration suite has nothing to prove, so it skips (and
      # `coverage` skips with it, since it needs db-tests to succeed). A docs-only
      # PR then runs exactly one job: Lint, test, build.
      code: ${{ steps.filter.outputs.code }}
      # Blast-radius: a change here can't be safely narrowed to one flow, so the
      # e2e job runs the FULL suite (see the "Select e2e specs" step).
      broad: ${{ steps.filter.outputs.broad }}
      # Per-flow area flags. Each maps SOURCE paths -> the e2e AREA they exercise;
      # the e2e job unions the true areas' specs (+ the layout/smoke/a11y floor)
      # into a selective Playwright run. The area -> spec map lives in the
      # "Select e2e specs" step; keep the two halves in sync.
      sort: ${{ steps.filter.outputs.sort }}
      results: ${{ steps.filter.outputs.results }}
      onboarding: ${{ steps.filter.outputs.onboarding }}
      auth: ${{ steps.filter.outputs.auth }}
      collection: ${{ steps.filter.outputs.collection }}
      members: ${{ steps.filter.outputs.members }}
      items: ${{ steps.filter.outputs.items }}
      profile: ${{ steps.filter.outputs.profile }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            ui:
              - 'src/app/**'
              - 'src/components/**'
              - 'src/features/**'
              - 'src/hooks/**'
              - 'src/lib/design/**'
              - '**/*.css'
              - 'tailwind.config.ts'
              - 'postcss.config.mjs'
              - 'next.config.mjs'
              - 'e2e/**'
              - 'playwright.config.ts'
              # A framework/dep bump (e.g. `next`) changes only these files but
              # can affect what ships to the browser (Next/React/middleware), so
              # it must still get e2e validation (purses-966p).
              - 'package.json'
              - 'package-lock.json'
            # The sort-recompute hot path — the ONLY thing the advisory bench
            # cares about. Keep in sync with scripts/bench-recompute.ts.
            hot:
              - 'src/server/services/**'
              - 'src/lib/insertion-ranking.ts'
              - 'src/lib/db/**'
              - 'scripts/seed-load.ts'
              - 'scripts/seed-load-core.ts'
              - 'scripts/bench-recompute.ts'
            # Anything that can change runtime or test behaviour. Gates the DB
            # integration suite (and, transitively, the coverage floor): a change
            # confined to docs/, graphify-out/, .beads/, .claude/, or the root
            # *.md governance files cannot affect a DB test, so running the whole
            # Postgres suite for it is pure cost.
            #
            # POSITIVE patterns ONLY, and deliberately a SUPERSET — see the
            # paths-filter negation note below for why "!" is not an option here.
            # The failure mode we care about is skipping the suite when it WAS
            # needed, so anything ambiguous (public/, vercel.json, the workflows
            # themselves) is listed and simply over-triggers. Root-level globs
            # ('*.json' etc.) have no slash, so they match only the repo root and
            # catch every config file (package.json, tsconfig, *.config.*).
            code:
              - 'src/**'
              - 'drizzle/**'
              - 'e2e/**'
              - 'scripts/**'
              - 'bench/**'
              - 'public/**'
              - '.github/workflows/**'
              - '.githooks/**'
              - '*.json'
              - '*.ts'
              - '*.mts'
              - '*.mjs'
              - '*.js'
            # Blast-radius paths: shared UI primitives, design tokens, global
            # styles, build/dep config, the e2e harness itself, and broad
            # server/db changes. A change here can affect ANY flow, so we can't
            # safely narrow — force the FULL e2e suite. (Server/db-only changes
            # keep ui==false and skip e2e entirely; broad only forces full when
            # it rides along with a UI change that already set ui==true.)
            broad:
              - 'src/components/ui/**'
              - 'src/lib/design/**'
              - '**/*.css'
              - 'tailwind.config.ts'
              - 'postcss.config.mjs'
              - 'next.config.mjs'
              - 'e2e/**'
              - 'playwright.config.ts'
              - 'package.json'
              - 'package-lock.json'
              - 'src/lib/db/**'
              - 'src/server/**'
            # ---- Per-flow AREA filters (SOURCE paths -> e2e area) ----
            # '*' stands in for the dynamic [id] route segment (picomatch reads
            # a literal '[id]' as a character class, so we avoid the brackets).
            sort:
              - 'src/features/sorting/**'
              - 'src/features/sessions/**'
              - 'src/app/collections/*/sort/**'
              - 'src/lib/triage-selection.ts'
              - 'src/lib/pairwise-selection.ts'
              - 'src/lib/usage-selection.ts'
              - 'src/lib/derive-usage.ts'
              - 'src/lib/decision-order.ts'
              - 'src/lib/decision-batch-schema.ts'
              - 'src/lib/round-preference.ts'
              - 'src/lib/round-timer.ts'
              - 'src/lib/insertion-ranking.ts'
            results:
              - 'src/features/results/**'
              - 'src/features/sessions/**'
              - 'src/app/collections/*/results/**'
              - 'src/app/shared-results/**'
              - 'src/lib/next-round.ts'
              - 'src/lib/results-buckets.ts'
              - 'src/lib/what-moved.ts'
            onboarding:
              - 'src/features/onboarding/**'
              - 'src/app/welcome/**'
              - 'src/app/tutorial/**'
            auth:
              - 'src/middleware.ts'
              - 'src/lib/auth.ts'
              - 'src/lib/auth-client.ts'
              - 'src/lib/auth-server.ts'
              - 'src/lib/middleware-auth.ts'
              - 'src/app/login/**'
              - 'src/app/signup/**'
              - 'src/app/api/auth/**'
            collection:
              - 'src/features/collections/**'
              - 'src/features/pool/**'
              - 'src/app/collections/page.tsx'
              - 'src/app/collections/*/page.tsx'
              - 'src/app/collections/*/edit/**'
            members:
              - 'src/app/collections/*/members/**'
              - 'src/app/invitations/**'
              - 'src/lib/collection-access.ts'
            items:
              - 'src/features/items/**'
              - 'src/app/collections/*/items/**'
              - 'src/lib/items.ts'
              - 'src/lib/photos.ts'
              - 'src/lib/photo-serving.ts'
              - 'src/lib/photo-variants.ts'
              - 'src/lib/heic.ts'
            profile:
              - 'src/features/profile/**'
              - 'src/app/profile/**'

  # E2E only runs when `changes` says the UI moved. When it doesn't, this job is
  # skipped — which GitHub reports as success, so it can be a REQUIRED check
  # (mark it required in main's branch protection) without blocking non-UI PRs.
  # Playwright's globalSetup spins its own postgres:16 on :5433 via
  # e2e/fixtures/test-db.sh (Docker is preinstalled on ubuntu runners); the
  # webServer builds + starts next on :3100 with the injected test DB.
  e2e:
    name: E2E (Playwright)
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # iPad/iPhone devices are WebKit; Desktop Chrome is Chromium — install both.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      # Decide which specs to run. FULL suite (specs="") when: merging to main
      # (the safety net), a blast-radius change (broad), or a UI change that
      # mapped to NO area (unknown surface -> don't under-test). Otherwise
      # SELECTIVE: the union of the touched areas' specs plus the always-on
      # layout/smoke/a11y floor. The area -> spec map below is the sibling of
      # the source -> area filters in the `changes` job; keep them in sync.
      - name: Select e2e specs
        id: select
        env:
          REF: ${{ github.ref }}
          BROAD: ${{ needs.changes.outputs.broad }}
          A_SORT: ${{ needs.changes.outputs.sort }}
          A_RESULTS: ${{ needs.changes.outputs.results }}
          A_ONBOARDING: ${{ needs.changes.outputs.onboarding }}
          A_AUTH: ${{ needs.changes.outputs.auth }}
          A_COLLECTION: ${{ needs.changes.outputs.collection }}
          A_MEMBERS: ${{ needs.changes.outputs.members }}
          A_ITEMS: ${{ needs.changes.outputs.items }}
          A_PROFILE: ${{ needs.changes.outputs.profile }}
        run: |
          set -euo pipefail
          # Always-on floor: cheap, cross-cutting specs (layout + smoke + a11y).
          FLOOR="e2e/layout.spec.ts e2e/smoke.spec.ts e2e/a11y.spec.ts"
          area_specs=""
          matched=0
          add() { area_specs="$area_specs $1"; matched=1; }
          if [ "$A_SORT" = "true" ]; then
            add "e2e/compare.spec.ts e2e/not-mine-set-aside.spec.ts e2e/not-yet-defer.spec.ts e2e/session-create-after-set-aside.spec.ts e2e/session-pause.spec.ts e2e/session-undo.spec.ts e2e/sort-images.spec.ts e2e/sort-session.spec.ts e2e/usage-round.spec.ts"
          fi
          if [ "$A_RESULTS" = "true" ]; then
            add "e2e/results.spec.ts e2e/results-onward.spec.ts e2e/results-rerank.spec.ts"
          fi
          if [ "$A_ONBOARDING" = "true" ]; then
            add "e2e/welcome-walkthrough.spec.ts"
          fi
          if [ "$A_AUTH" = "true" ]; then
            add "e2e/auth.spec.ts e2e/auth-navigation.spec.ts"
          fi
          if [ "$A_COLLECTION" = "true" ]; then
            add "e2e/adaptive-collection-workspace.spec.ts e2e/delete-collection.spec.ts"
          fi
          if [ "$A_MEMBERS" = "true" ]; then
            add "e2e/members.spec.ts"
          fi
          if [ "$A_ITEMS" = "true" ]; then
            add "e2e/item-page.spec.ts e2e/item-removal.spec.ts e2e/delete-photo.spec.ts e2e/image-perf.spec.ts e2e/image-rotate.spec.ts"
          fi
          if [ "$A_PROFILE" = "true" ]; then
            add "e2e/profile.spec.ts"
          fi
          if [ "$REF" = "refs/heads/main" ] || [ "$BROAD" = "true" ] || [ "$matched" = "0" ]; then
            mode="FULL"
            list="(entire suite)"
            echo "specs=" >> "$GITHUB_OUTPUT"
          else
            mode="SELECTIVE"
            list="$FLOOR$area_specs"
            echo "specs=$list" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "## E2E spec selection"
            echo ""
            echo "- Mode: **$mode**"
            echo "- Specs: $list"
          } >> "$GITHUB_STEP_SUMMARY"

      # Empty steps.select.outputs.specs -> `npx playwright test` (full suite);
      # a spec list -> only those files. The `setup` project (auth state) is a
      # project dependency, so it runs regardless of the file filter.
      - name: Run e2e
        run: npx playwright test ${{ steps.select.outputs.specs }}
        env:
          DATABASE_URL_TEST: postgresql://postgres:test@localhost:5433/app_test

      # Inline dashboard: render the JSON stats into the run's summary page so
      # results are visible at a glance without downloading the artifact.
      - name: Publish e2e summary
        if: ${{ !cancelled() }}
        run: |
          node -e '
            const fs = require("fs");
            const p = "playwright-report/results.json";
            if (!fs.existsSync(p)) { console.log("no results.json"); process.exit(0); }
            const s = (JSON.parse(fs.readFileSync(p, "utf8")).stats) || {};
            const dur = Math.round((s.duration || 0) / 1000);
            const md = [
              "## Playwright e2e",
              "",
              "| ✅ Passed | ❌ Failed | ⚠️ Flaky | ⏭️ Skipped | ⏱ Duration |",
              "|---|---|---|---|---|",
              `| ${s.expected ?? 0} | ${s.unexpected ?? 0} | ${s.flaky ?? 0} | ${s.skipped ?? 0} | ${dur}s |`,
              "",
              "Full HTML report (traces, screenshots) is in the **playwright-report** artifact.",
              "",
            ].join("\n");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
          '

      # Always keep the full HTML report (downloadable dashboard), pass or fail.
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Sort-recompute p95 GATE. Runs ONLY when the hot path moves (the `changes`
  # filter `hot`), against the same postgres:16 service the db-tests job uses,
  # and FAILS the build on a catastrophic regression (compare-phase p95 above 4×
  # the committed baseline).
  # It catches an ALGORITHMIC shape regression at a fixed item count — NOT
  # absolute prod latency (local Docker p95 ≠ Neon p95), which is why the
  # threshold is 4× and not 2×: the baseline was taken on a dev Mac and this
  # runner already measures ~1.5× that from hardware alone. A tighter gate would
  # flake, and a flaky gate gets disabled — worse than no gate.
  # Do NOT "fix" a red bench by re-baselining. Find what got slower.
  bench:
    name: Recompute bench (p95 gate)
    needs: changes
    if: needs.changes.outputs.hot == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply schema
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/app_test

      - name: Run advisory recompute benchmark (check mode)
        run: npm run bench:recompute -- --items=100
        env:
          DATABASE_URL_TEST: postgresql://postgres:test@localhost:5432/app_test

  # Publish the reports dashboard to the gh-pages branch (main only). Plain git
  # push with the built-in GITHUB_TOKEN — no third-party Pages action. Coverage
  # refreshes on every main push; the e2e report refreshes only when e2e ran;
  # each deploy overwrites just the subdir(s) it built, so the other report
  # survives (the "keep_files" behaviour, done by hand). Also appends a metrics
  # row and regenerates the trends page.
  deploy-report:
    name: Publish reports dashboard
    needs: [changes, gate, e2e, coverage]
    # Run on main pushes whenever the gate passed, even if e2e was skipped
    # (non-UI push) or failed (we still want to publish the failure report).
    # A breached coverage floor likewise does NOT suppress the dashboard — the
    # dashboard should reflect reality; the floor gates PRs, not publishing.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !cancelled() && needs.gate.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # Absent on a docs-only push: db-tests skips, so `coverage` skips and never
      # uploads. The assemble step below already no-ops on an empty dir, leaving
      # the previously published coverage in place — correct, since a docs-only
      # push didn't change it. Without continue-on-error this download would hard-
      # fail the dashboard (the e2e download below has always needed the same).
      - name: Download coverage artifact (absent on docs-only pushes)
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: coverage-report
          path: _artifacts/coverage

      - name: Download e2e artifact (absent on non-UI pushes)
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: playwright-report
          path: _artifacts/e2e

      - name: Assemble site and push to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          rm -rf site
          if git ls-remote --exit-code --heads "$REMOTE" gh-pages >/dev/null 2>&1; then
            git clone --quiet --branch gh-pages --depth 1 "$REMOTE" site
          else
            mkdir site && git -C site init --quiet && git -C site checkout --quiet -b gh-pages
          fi
          # Landing page always latest; .nojekyll so report asset dirs aren't mangled.
          cp .github/pages/index.html site/index.html
          touch site/.nojekyll
          if [ -d _artifacts/coverage ] && [ -n "$(ls -A _artifacts/coverage 2>/dev/null)" ]; then
            rm -rf site/coverage && cp -r _artifacts/coverage site/coverage
          fi
          if [ -d _artifacts/e2e ] && [ -n "$(ls -A _artifacts/e2e 2>/dev/null)" ]; then
            rm -rf site/e2e && cp -r _artifacts/e2e site/e2e
          fi
          node .github/pages/append-history.mjs site _artifacts
          cd site
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet -m "reports: ${GITHUB_SHA::7}" || { echo "no changes to publish"; exit 0; }
          git push --quiet "$REMOTE" gh-pages
