name: CI

# Thin test gate: lint + unit tests + build.
# GitHub Flow (solo): feature branch -> PR into main -> merge -> prod deploy.
# Runs on PRs targeting main and on pushes to main. It is a required status
# check in main's branch protection, so a PR cannot merge until it is green.
# Feature-branch pushes get a Vercel preview (against the dev database) but
# don't run this workflow until a PR is opened against main.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (with coverage)
        run: npm run test:ci -- --coverage

      # Coverage for the dashboard. Unit/component only — the DB integration
      # suite runs in the db-tests job and is not reflected here.
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Build
        run: npm run build
        env:
          # next build imports src/lib/env.ts, which validates these at module
          # load. They are dummy build-time values — no real DB/secret needed to
          # compile. Runtime values come from Vercel's environment.
          DATABASE_URL: postgresql://user:pass@localhost:5432/ci
          AUTH_URL: http://localhost:3000
          AUTH_SECRET: ci-build-only-secret-at-least-32-characters-long

  # DB-gated tests (RUN_DB_TESTS=1) against a real Postgres service. These are
  # describe.skip'd in the plain `gate` job, so the IDOR/pool-schema guard tests
  # only run here. Files run serially (--no-file-parallelism): concurrent
  # RUN_DB_TESTS files deadlock on the shared DB.
  db-tests:
    name: DB integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply schema
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/app_test

      - name: DB tests (serial)
        run: RUN_DB_TESTS=1 npx vitest run --no-file-parallelism src/lib/db
        env:
          DATABASE_URL_TEST: postgresql://postgres:test@localhost:5432/app_test

  # Did this change touch the UI / how data is presented? Playwright is slow
  # (full next build + 3 viewports, serial), so we only run it when the view
  # layer changed. Pure server/API/db changes are covered by `gate` + `db-tests`
  # and skip e2e. `src/app/api/**` is server code, so it's excluded even though
  # it lives under src/app/**.
  changes:
    name: Detect UI changes
    runs-on: ubuntu-latest
    # dorny/paths-filter lists the PR's changed files via the GitHub API, which
    # needs pull-requests:read. Scoped to this job so other jobs keep the repo
    # default token permissions.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ui:
              - 'src/app/**'
              - '!src/app/api/**'
              - 'src/components/**'
              - 'src/features/**'
              - 'src/hooks/**'
              - 'src/lib/design/**'
              - '**/*.css'
              - 'tailwind.config.ts'
              - 'postcss.config.mjs'
              - 'next.config.mjs'
              - 'e2e/**'
              - 'playwright.config.ts'

  # E2E only runs when `changes` says the UI moved. When it doesn't, this job is
  # skipped — which GitHub reports as success, so it can be a REQUIRED check
  # (mark it required in main's branch protection) without blocking non-UI PRs.
  # Playwright's globalSetup spins its own postgres:16 on :5433 via
  # e2e/fixtures/test-db.sh (Docker is preinstalled on ubuntu runners); the
  # webServer builds + starts next on :3100 with the injected test DB.
  e2e:
    name: E2E (Playwright)
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # iPad/iPhone devices are WebKit; Desktop Chrome is Chromium — install both.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run e2e
        run: npx playwright test
        env:
          DATABASE_URL_TEST: postgresql://postgres:test@localhost:5433/app_test

      # Inline dashboard: render the JSON stats into the run's summary page so
      # results are visible at a glance without downloading the artifact.
      - name: Publish e2e summary
        if: ${{ !cancelled() }}
        run: |
          node -e '
            const fs = require("fs");
            const p = "playwright-report/results.json";
            if (!fs.existsSync(p)) { console.log("no results.json"); process.exit(0); }
            const s = (JSON.parse(fs.readFileSync(p, "utf8")).stats) || {};
            const dur = Math.round((s.duration || 0) / 1000);
            const md = [
              "## Playwright e2e",
              "",
              "| ✅ Passed | ❌ Failed | ⚠️ Flaky | ⏭️ Skipped | ⏱ Duration |",
              "|---|---|---|---|---|",
              `| ${s.expected ?? 0} | ${s.unexpected ?? 0} | ${s.flaky ?? 0} | ${s.skipped ?? 0} | ${dur}s |`,
              "",
              "Full HTML report (traces, screenshots) is in the **playwright-report** artifact.",
              "",
            ].join("\n");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
          '

      # Always keep the full HTML report (downloadable dashboard), pass or fail.
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
