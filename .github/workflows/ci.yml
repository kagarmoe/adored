name: ci

# Runs lint + typecheck + unit/integration tests on every PR and every push
# to main. This is the structural enforcement point for the "passing tests =
# the app works" contract (purses-chh.5): a red suite here must block the
# merge to main, which is configured via branch protection requiring the
# `lint`, `typecheck`, and `test` checks below to be green.
#
# See TESTING.md for the full contract + verification procedure.
#
# What's NOT here (yet):
#   - e2e — Playwright browsers + a real test DB need to land first
#     (purses-chh.1). When that bead closes, add an `e2e` job here and
#     add it to the required checks list.
#   - build — Vercel runs `prisma generate && next build` on every push,
#     duplicating it here would cost CI minutes without adding signal.

on:
  pull_request:
  push:
    branches: [main]

# Cancel in-progress runs on the same ref when a new push lands — avoids
# wasted minutes when a branch is force-pushed mid-run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      # @prisma/client typings are generated, not committed. tsc --noEmit
      # against unresolved imports of @/lib/db (which re-exports the client)
      # would fail without this.
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Typecheck
        run: npx tsc --noEmit

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Ephemeral Postgres for the vitest suite. The default is to use the
    # real DB (lib/test-db.ts) and only mock @/lib/db when a test is
    # genuinely a unit test — that's how schema-drift gets caught
    # (purses-chh.3, schema-drift.test.ts, the 2026-05-15 outage class).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: purseinator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d purseinator_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/purseinator_test

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate Prisma ORM client
        # Prisma is the ORM only. `prisma generate` builds the TypeScript
        # client from prisma/schema.prisma; it does not touch the database.
        run: npx prisma generate
      - name: Apply test schema (psql, no Prisma migration tool)
        # Hand-written SQL bootstrap — see prisma/test-schema.sql.
        # vitest.global-setup.ts will also DROP + reapply per run, but
        # priming the DB first means setup runs against a known state.
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          PGPASSWORD=test psql -v ON_ERROR_STOP=1 \
            -h localhost -U test -d purseinator_test \
            -f prisma/test-schema.sql
      - name: Test (vitest)
        run: npm test
