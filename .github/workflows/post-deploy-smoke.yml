name: post-deploy smoke

# Runs the smoke probe (scripts/smoke.mjs) after every successful Vercel
# Production deploy. Vercel posts a `deployment_status` event to GitHub when
# the deploy goes live; we filter for state=success + environment=Production
# and run the probe against the live app.
#
# Failure surfaces three ways:
#   1. A red ✗ on the commit (from the failed workflow check).
#   2. A failed workflow run (default GitHub setting: email to commit author).
#   3. A `deployment_status: failure` posted back onto the same GitHub
#      Deployment, so the Vercel deploy is marked unhealthy in the GitHub
#      Deployments UI. This is the structural deploy gate purses-chh.5 calls
#      for: "a green build with a failing smoke is NOT a successful deploy."
#
# Re-runnable manually via the "Run workflow" button (workflow_dispatch).

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      demo_url:
        description: 'Override SMOKE_DEMO_URL'
        required: false
        default: ''
      app_url:
        description: 'Override SMOKE_APP_URL'
        required: false
        default: ''

jobs:
  smoke:
    # Only run for successful Production deploys (or a manual dispatch).
    # The `deployment_status` event fires for every state transition; filtering
    # to `success` avoids 4 wasted runs per deploy (pending/building/...).
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Needed to POST deployment_status=failure back onto the deployment when
    # the smoke fails. Without this permission the gh api call below silently
    # 403s and the deployment stays green even though the smoke is red.
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run smoke
        id: smoke
        # No secrets. The probe is fully unauthenticated: demo + /login +
        # /api/health (which exercises Prisma → pg → Neon). We deliberately
        # do NOT put AUTH_SECRET in GitHub — that secret is the JWT signing
        # key (forges any session) and adding it would double its exposure
        # surface (Vercel + GitHub) and expose it to anyone with repo-write.
        env:
          SMOKE_DEMO_URL: ${{ inputs.demo_url }}
          SMOKE_APP_URL: ${{ inputs.app_url }}
        run: npm run smoke

      - name: Mark deployment unhealthy on smoke failure
        # Structural deploy gate (purses-chh.5): POST a deployment_status of
        # `failure` back onto the same GitHub Deployment so the Vercel deploy
        # is marked unhealthy in the Deployments UI. Without this, a failed
        # smoke would still leave the deployment green in GitHub.
        # Only meaningful for deployment_status-triggered runs (manual
        # dispatch has no deployment to flag).
        if: failure() && github.event_name == 'deployment_status' && steps.smoke.conclusion == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ github.event.deployment.id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/deployments/${DEPLOYMENT_ID}/statuses" \
            -f state=failure \
            -f description="post-deploy smoke failed" \
            -f log_url="${RUN_URL}" \
            -f environment="${{ github.event.deployment.environment }}"
