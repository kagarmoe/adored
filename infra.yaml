# infra.yaml — Infrastructure reference for purseinator_app
#
# For Claude (Mayor) and ALL agents. Read this BEFORE touching deploys, the
# database, migrations, environment variables, or auth/email. It exists because
# wrong assumptions about this stack caused a production outage on 2026-05-15.

project: purseinator-app
stack:
  hosting:  Vercel
  database: Neon Postgres (via the Vercel Marketplace integration)
  email:    Resend (transactional email — magic-link sign-in)
  auth:     Auth.js / NextAuth v5 (next-auth ^5.0.0-beta.31), JWT session strategy
  orm:      Prisma

# ──────────────────────────────────────────────────────────────────────────
vercel:
  role: Hosts the Next.js app. Auto-deploys to production on push to `main`.
  build_command: "prisma generate && next build"
  critical:
    - "The build does NOT run database migrations. `next build` only generates
       the Prisma client. Deploying CODE never changes the DATABASE SCHEMA."
    - "Merging a PR + Vercel auto-deploying it ships code only. If that code
       expects a new schema, every DB query 500s until the migration is applied
       SEPARATELY and MANUALLY (see `migrations:`)."
    - "Env var changes do NOT affect the running deployment — a redeploy is
       required: `vercel redeploy <prod-url> --target production`."
  cli: "Authenticated as kagarmoe. Useful: `vercel ls --prod`, `vercel logs <url>`,
        `vercel env ls production`, `vercel redeploy <url> --target production`."

neon:
  role: "The Postgres database. Provisioned by the Vercel<->Neon Marketplace
         integration, which injects the connection env vars (DATABASE_URL,
         POSTGRES_URL, POSTGRES_PRISMA_URL, POSTGRES_URL_NON_POOLING, etc.)."
  critical:
    - "The Vercel-Neon integration ONLY provisions the database and its
       connection strings. It does NOT run migrations. 'We use Vercel Neon'
       does not mean schema changes are automatic — they never are."
  applying_schema_changes: "Manual. Preferred: the Neon dashboard SQL editor
                            (no connection string to handle). Or psql with the
                            production DATABASE_URL."

migrations:
  approach: |
    Hand-written SQL, applied MANUALLY to Neon. We do NOT use Prisma's
    migration tool (`prisma migrate dev` / `prisma migrate deploy`) — it is
    incompatible with this setup (see `critical` below). Prisma is used as
    the ORM only (the runtime client + schema-to-client codegen, not migrations).
  schema_source: |
    prisma/schema.prisma — the Prisma schema, read by `prisma generate` to
    build the runtime client. When the schema changes here, ALSO write a
    matching SQL migration file by hand.
  files: |
    prisma/migrations/<timestamp>_<name>/migration.sql — hand-written SQL.
    The directory follows the Prisma filesystem convention but the files are
    hand-written, NOT Prisma-generated.
  critical:
    - "There is NO migration_lock.toml. Migrations are hand-applied and NOT
       recorded in a _prisma_migrations tracking table."
    - "DO NOT run `prisma migrate deploy` against production — with no
       tracking table it re-applies already-applied migrations and fails."
    - "To apply a new migration: run that ONE migration.sql directly against
       Neon (SQL editor / psql), as a SINGLE batch. Ordering within a file
       can be load-bearing (e.g. backfill rows BEFORE a DROP COLUMN)."
  applied_to_production:   # keep this list current — update when one is applied
    - {file: 20260509060000_add_bg_removal_to_photo, status: applied}
    - {file: 20260509070000_originalblobkey_unique,  status: applied}
    - {file: 20260509080000_add_isdemo_to_collection, status: applied}
    - {file: 20260514220000_per_collection_roles,    status: "applied 2026-05-15"}

resend:
  role: Sends the magic-link sign-in emails.
  api_key_env: AUTH_RESEND_KEY
  from_address: "onboarding@resend.dev  (set in auth.ts)"
  critical:
    - "`onboarding@resend.dev` is Resend's SHARED SANDBOX sender. It can ONLY
       deliver to the email address that owns the Resend account. Any other
       recipient is rejected (403)."
    - "To email arbitrary users (e.g. curator invites), verify a domain in
       Resend and change the `from` to an address on that domain."

auth:
  framework: "Auth.js / NextAuth v5 — Resend (email) provider, JWT sessions"
  files: [auth.ts, lib/auth-adapter.ts, lib/auth-callbacks.ts]
  critical:
    - "GOTCHA THAT CAUSED AN OUTAGE: for the email/Resend provider, the `signIn`
       callback runs at SEND TIME (in @auth/core/lib/actions/signin/send-token.js,
       with email.verificationRequest === true). If `signIn` returns falsy there,
       @auth/core throws AccessDenied and the magic-link email is NEVER SENT — it
       does not merely block the final sign-in."
    - "So the `signIn` callback must NOT require a DB user row at the
       verification-request step — a brand-new user has no row yet; the adapter's
       createUser inserts it later, at link-click time. Self-signup needs
       `return !!user.email` there."

env_vars:
  critical:
    - "AUTH_SECRET, AUTH_URL, AUTH_RESEND_KEY, DATABASE_URL and the POSTGRES_*
       set are marked SENSITIVE in Vercel. Sensitive vars CANNOT be read back:
       `vercel env ls` lists them but `vercel env pull` returns them EMPTY. They
       can only be overwritten (`vercel env add <NAME> <env> --force`)."
    - "An empty value from `vercel env pull` does NOT mean the var is unset — it
       means the var is Sensitive. Never diagnose 'the var is empty' from a pull."
  setting_secrets_safely:
    - "Generated secrets: pipe, never echo —
       `openssl rand -base64 32 | tr -d '\\n' | vercel env add AUTH_SECRET production --force`."
    - "Secrets a human holds: the human sets them in the Vercel dashboard. Never
       put a secret in chat, a `! ` command, or a file an agent will read."

post_deploy_smoke:
  role: "Automated gate that runs after every successful Vercel Production
         deploy. Probes the demo host and /login — fails the workflow on any
         non-200 or error-page render. That is the visible signal."
  script: "scripts/smoke.mjs (npm run smoke)"
  workflow: ".github/workflows/post-deploy-smoke.yml (deployment_status event)"
  secrets: "NONE — the workflow runs with --public-only. We deliberately do
            NOT put AUTH_SECRET in GitHub: it would double its exposure
            surface (Vercel + GitHub) and expose it to anyone with repo-write
            (a malicious workflow edit could exfiltrate it). For DB-exercise
            coverage without forging a session, the follow-up plan is an
            unauthenticated /api/health endpoint that the smoke probes."
  docs: "docs/smoke-test.md"
  origin: "Built after the 2026-05-15 demo-500 outage was caught by a manual
           curl. This is the test that would have caught it in seconds."

e2e:
  role: "Playwright browser tests (e2e/*.spec.ts) against a real Next dev
         server backed by an ephemeral Postgres. Runs in CI, NOT in polecat
         sandboxes (which lack Postgres + a Docker socket). This is the
         contract for 'sandbox can't run e2e' — it doesn't mean skip, it
         means push and let the workflow run it."
  script: "playwright test (npm run e2e)"
  workflow: ".github/workflows/e2e.yml (push + pull_request + workflow_dispatch)"
  schema_path: "`prisma db push` from prisma/schema.prisma — matches the
                'we don't use prisma migrate' convention (no _prisma_migrations
                tracking table)."
  secrets: "NONE from GitHub. The workflow inlines test-only AUTH_SECRET and
            DATABASE_URL pointed at the in-job Postgres service. No prod
            credential ever enters the runner — same posture as
            post_deploy_smoke."
  on_demand: "gh workflow run e2e.yml [--ref <branch>]"
  docs: "TESTING.md"

# ──────────────────────────────────────────────────────────────────────────
# Checklist when a schema-affecting change merges to `main`:
#   1. Vercel auto-deploys the CODE (automatic).
#   2. Apply the new migration.sql to Neon — MANUAL, SEPARATE step.
#   3. Redeploy only if env vars changed (not needed for a migration alone).
#   4. Verify: hit the demo host + an authenticated path; check `vercel logs`.
#   5. The post-deploy smoke workflow runs automatically — but if the
#      migration was applied AFTER the deploy, manually re-run the workflow
#      (Actions → post-deploy smoke → Run workflow) to confirm green now.
