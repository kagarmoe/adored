id: d3e1a402-cb2a-4959-94dc-e5e5fb9c1a62
name: adored-health
description: >-
  Is Adored healthy? Confirms adored.kimberlygarmoe.com serves a READY
  production deployment of main, crawls the public surface for broken targets,
  and runs unit coverage and the Playwright suite locally.
jobs:
  - name: prod
    steps:
      - name: alias
        task:
          type: model_method
          modelIdOrName: adored-alias
          methodName: lookup
      - name: deployment
        task:
          type: model_method
          modelIdOrName: adored-deployments
          methodName: get
      - name: deployment-ready
        task:
          type: assert
          expr: >-
            data.latest("adored-deployments", "purseinator-app").attributes.readyState == "READY"
            && data.latest("adored-deployments", "purseinator-app").attributes.target == "production"
            && data.latest("adored-deployments", "purseinator-app").attributes.meta.githubCommitRef == "main"
          message: >-
            Alias points at a deployment that is not READY/production/main (state ${{ data.latest("adored-deployments", "purseinator-app").attributes.readyState }})
      - name: crawl
        task:
          type: model_method
          modelIdOrName: adored-links
          methodName: crawl
      - name: no-broken-links
        task:
          type: assert
          expr: >-
            int(data.latest("adored-links", "audit-adored.kimberlygarmoe.com").attributes.brokenCount) == 0
          message: >-
            ${{ data.latest("adored-links", "audit-adored.kimberlygarmoe.com").attributes.brokenCount }} broken targets on adored.kimberlygarmoe.com
  - name: tests
    steps:
      - name: coverage
        task:
          type: model_method
          modelIdOrName: adored-tests
          methodName: coverage
      - name: coverage-ok
        task:
          type: assert
          expr: >-
            data.latest("adored-tests", "coverage-total").attributes.testsPassed == true
            && data.latest("adored-tests", "coverage-total").attributes.belowFloor == false
          message: >-
            Unit tests failed or line coverage ${{ data.latest("adored-tests", "coverage-total").attributes.lines.pct }}% is under the floor
      - name: e2e
        task:
          type: model_method
          modelIdOrName: adored-tests
          methodName: e2e
      - name: e2e-green
        task:
          type: assert
          expr: >-
            int(data.latest("adored-tests", "e2e-latest").attributes.failed) == 0
          message: >-
            ${{ data.latest("adored-tests", "e2e-latest").attributes.failed }} Playwright failures
